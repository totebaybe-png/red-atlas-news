name: Red Atlas Gold Desk (Daily)

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-atlas-repo-sync
  cancel-in-progress: false

jobs:
  update-gold-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild and publish all 18 gold & silver pages
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
        run: python -m engine.gold_pages --publish

      - name: Save verified gold snapshot
        if: always()
        run: |
          git config user.name "Red Atlas Bot"
          git config user.email "bot@redatlasnews.com"
          git add data/gold.json output/gold-pages/
          if ! git diff --cached --quiet; then
            git commit -m "gold-desk: hourly update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin main
          fi
