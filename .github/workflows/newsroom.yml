name: Red Atlas Newsroom (Every 2 Hours)

on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-atlas-repo-sync
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsroom and publish to Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
        run: python -m engine.run --count 1 --publish

      - name: Save seen stories, published links and cover images
        if: always()
        run: |
          git config user.name "Red Atlas Bot"
          git config user.email "bot@redatlasnews.com"
          git add -A data output
          if ! git diff --cached --quiet; then
            git commit -m "newsroom: automated run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin main
          fi
